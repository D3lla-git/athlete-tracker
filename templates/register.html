{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow">
      <div class="card-header"><h4>Student/Athlete Registration <i class="fa-solid fa-futbol"></i><i class="fa-solid fa-basketball-ball" style="color: orangered;"></i></h4></div> 
      <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label>Full Name <i class="fa-solid fa-user"></i></label>
            <input type="text" name="full_name" placeholder="Example: John Brown" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>School Name <i class="fa-solid fa-school"></i></label>
            <input type="text" name="school" placeholder="Example: St. John's High School" class="form-control" required>
          </div>
          <div class="mb-3">
  <label class="form-label">
    Gender <i class="fa-solid fa-venus-mars"></i>
  </label>

  <select name="gender" class="form-select" required>
    <option value="">-- Select Gender --</option>
    <option value="Male">Male ♂</option>
    <option value="Female">Female ♀</option>
  </select>
</div>
          <div class="mb-3">
  <label class="form-label">Password <i class="fa-solid fa-key"></i></label>
  <div class="input-group">
    <input type="password" name="password" id="password" placeholder="Example: @Xxxxx" class="form-control" required>
    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
      <i class="fa-solid fa-eye" id="eyeIcon"></i>
    </button>
  </div>
</div>

<script>
  const togglePassword = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  togglePassword.addEventListener('click', function () {
    // Toggle the type attribute
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);

    // Toggle the eye icon
    if (type === 'password') {
      eyeIcon.classList.remove('fa-eye-slash');
      eyeIcon.classList.add('fa-eye');
    } else {
      eyeIcon.classList.remove('fa-eye');
      eyeIcon.classList.add('fa-eye-slash');
    }
  });
</script>
          <div class="mb-3">
            <label>Student ID or Passport (PNG/JPG/PDF)</label>
            <input type="file" name="id_document" class="form-control" accept=".png,.jpg,.jpeg,.pdf" required>
          </div>
          <button type="submit"  class="btn btn-success btn-lg rounded-5"
                  style="border: 2px solid black; color: white;">Register 
                  <i class="fa-solid fa-user-plus"></i></button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
