{% extends "base.html" %}
{% block title %}Edit Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-header">
        <h4 class="mb-0">Edit {{ record.sport }} Record ({{ record.year }})</h4>
      </div>
      <div class="card-body">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
  <label class="form-label">
    Position Played
    <i class="fa-solid fa-shirt"></i>
  </label>

  <select
      name="position"
      id="editPositionSelect"
      class="form-select"
      required>

    <option value="">-- Select Position --</option>

    {% if record.sport == 'Football' %}

      {% for position in [
        'GK',
        'CB',
        'LB',
        'LWB',
        'RWB',
        'RB',
        'DM',
        'CM',
        'AM',
        'LW',
        'RW',
        'SS',
        'CF'
      ] %}
        <option
            value="{{ position }}"
            {% if record.position == position %}selected{% endif %}>
          {{ position }}
        </option>
      {% endfor %}

    {% elif record.sport == 'Basketball' %}

      {% for position in [
        'Point Guard',
        'Shooting guard',
        'small forward',
        'power forward',
        'center'
      ] %}
        <option
            value="{{ position }}"
            {% if record.position == position %}selected{% endif %}>
          {{ position }}
        </option>
      {% endfor %}

    {% elif record.sport == 'Kickball' %}

      {% for position in [
        'Pitcher',
        'Catcher',
        '1st baseman',
        '2nd baseman',
        '3rd baseman',
        'Shortstop',
        'Left fielder',
        'Right fielder',
        'center fielder',
        'short fielder/Rover'
      ] %}
        <option
            value="{{ position }}"
            {% if record.position == position %}selected{% endif %}>
          {{ position }}
        </option>
      {% endfor %}

    {% endif %}

  </select>
</div>

<div class="col-md-6">
    <label class="form-label">
        Games Played
        <i class="fa-solid fa-person-running"></i>
    </label>
    <input
        type="number"
        name="games_played"
        id="gamesPlayedInput"
        class="form-control"
        value="1"
        min="0"
        max="1"
        step="1"
        required>
</div>

<div class="row g-3 mt-1">
  <div class="col-md-6">
   <label class="form-label">
    {% if record.sport == 'Kickball' %}
        QOTM
    {% else %}
        Man of the Match
    {% endif %}
    <i class="fa-solid fa-medal"></i>
</label>
    <input type="number"
           name="man_of_the_match"
           class="form-control"
           value="{{ record.man_of_the_match or 0 }}"
           min="0"
           step="1">
  </div>

  <div class="col-md-6">
    <label class="form-label">
      MVP <i class="fa-solid fa-star"></i>
    </label>
    <input type="number"
           name="mvp"
           class="form-control"
           value="{{ record.mvp or 0 }}"
           min="0"
           step="1">
  </div>
</div>

<div class="mb-4">
  <label class="form-label">Team Played For <i class="fa-solid fa-users"></i></label>
  <input type="text" name="team" class="form-control" value="{{ record.team or '' }}" placeholder="e.g. LPRC Oilers / St. John High School" required>
</div>

<div class="mb-4">
  <label class="form-label">Opponet <i class="fa-solid fa-shield-halved" style="color: red;"></i></label>
  <input type="text" name="team_played_against" class="form-control" value="{{ record.team_played_against or '' }}" placeholder="e.g. St. Mary Catholic School" required>
</div>

<div class="mb-4">
    <label class="form-label">
        Competition Category
        <i class="fa-solid fa-medal"></i>
    </label>

    <select
        name="competition_category"
        id="editCompetitionCategory"
        class="form-select"
        required>

        <option value="">-- Select Competition --</option>

        <option value="High School"
            {% if record.competition_category == 'High School' %}selected{% endif %}>
            High School Competition
        </option>

        <option value="County Meet"
            {% if record.competition_category == 'County Meet' %}selected{% endif %}>
            County Meet
        </option>

        <option value="Club League"
            {% if record.competition_category == 'Club League' %}selected{% endif %}>
            Club League
        </option>

        <option value="University League"
            {% if record.competition_category == 'University League' %}selected{% endif %}>
            University League
        </option>

        <option value="Community/Area League"
            {% if record.competition_category == 'Community/Area League' %}selected{% endif %}>
            Community/Area League
        </option>

        <option value="AFCON"
            {% if record.competition_category == 'AFCON' %}selected{% endif %}>
            AFCON
        </option>

        <option value="WAFU"
            {% if record.competition_category == 'WAFU' %}selected{% endif %}>
            WAFU
        </option>

        <option value="World Cup"
            {% if record.competition_category == 'World Cup' %}selected{% endif %}>
            World Cup
        </option>

    </select>
</div>

<div class="mb-4" id="clubDivisionOptions" style="display: none;">
    <label class="form-label">
        Club League Division
        <i class="fa-solid fa-layer-group"></i>
    </label>

    <select
        name="club_division"
        id="clubDivision"
        class="form-select">

        <option value="">-- Select Division --</option>

        <option value="1st Division"
            {% if record.club_division == '1st Division' %}selected{% endif %}>
            1st Division
        </option>

        <option value="2nd Division"
            {% if record.club_division == '2nd Division' %}selected{% endif %}>
            2nd Division
        </option>

        <option value="3rd Division"
            {% if record.club_division == '3rd Division' %}selected{% endif %}>
            3rd Division
        </option>

    </select>
</div>

<!-- AFCON / WAFU / World Cup team. Options are filled in by the script
     below from the server's list for the selected competition. -->
<div class="mb-4" id="competitionTeamOptions" style="display: none;">
    <label class="form-label" for="competitionTeam">
        <span id="competitionTeamLabel">Team</span>
        <i class="fa-solid fa-flag"></i>
    </label>

    <select
        name="competition_team"
        id="competitionTeam"
        class="form-select">
    </select>

    <script id="competitionTeamData" type="application/json">
        {{ {
            'options': competition_team_options,
            'labels': competition_team_labels,
            'selected': record.competition_team or ''
        } | tojson }}
    </script>
</div>

   <div class="mb-4">
    <label class="form-label fw-bold">
        Trophy Won
        <i class="fa-solid fa-trophy" style="color: silver;"></i>
        <i class="fa-solid fa-medal"></i>
        <i class="fa-solid fa-trophy" style="color: goldenrod;"></i>
    </label>

    <script id="trophyOptionsData" type="application/json">
        {{ {
            'table': trophy_options_table(),
            'sport': record.sport,
            'competition': record.competition_category,
            'trophy': record.trophy or '',
            'legacy': trophy_legacy
        } | tojson }}
    </script>

    <div id="trophyOptions" class="row g-2">

        <!-- Trophy checkboxes will be generated by JavaScript -->

    </div>
</div>
          </div>

  {% if record.sport == 'Football' %}

    <!-- Football Statistics -->
    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label">
                Goals <i class="fa-solid fa-futbol"></i>
            </label>
            <input type="number"
                   name="goals"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.goals or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Assists <i class="fa-solid fa-handshake"></i>
            </label>
            <input type="number"
                   name="assists"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.assists or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Yellow Cards
                <i class="fa-solid fa-square" style="color: yellow;"></i>
            </label>
            <input type="number"
                   name="yellow_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.yellow_cards or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Red Cards
                <i class="fa-solid fa-square" style="color: red;"></i>
            </label>
            <input type="number"
                   name="red_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.red_cards or 0 }}">
        </div>

        <!-- GK-only statistics -->
        <div id="goalkeeperStats" class="row g-3 mt-1"
             {% if record.position != 'GK' %}style="display:none;"{% endif %}>

            <div class="col-md-6">
                <label class="form-label">
                    Clean Sheets
                    <i class="fa-solid fa-shield-halved"></i>
                </label>
                <input type="number"
                       name="clean_sheets"
                       class="form-control"
                       min="0"
                       step="1"
                       value="{{ record.clean_sheets or 0 }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">
                    Saves
                    <i class="fa-solid fa-hand"></i>
                </label>
                <input type="number"
                       name="saves"
                       class="form-control"
                       min="0"
                       step="1"
                       value="{{ record.saves or 0 }}">
            </div>

        </div>

    </div>

{% elif record.sport == 'Kickball' %}

    <!-- Kickball Statistics -->
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">
                Home Run <i class="fa-solid fa-baseball"></i>
            </label>
            <input type="number"
                   name="home_runs"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.home_runs or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Red Card <i class="fa-solid fa-square" style="color: red;"></i>
            </label>
            <input type="number"
                   name="kickball_red_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.kickball_red_cards or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Yellow Card <i class="fa-solid fa-square" style="color: yellow;"></i>
            </label>
            <input type="number"
                   name="kickball_yellow_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.kickball_yellow_cards or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Cut Base <i class="fa-solid fa-person-running"></i>
            </label>
            <input type="number"
                   name="cut_base"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.cut_base or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Foul Played <i class="fa-solid fa-triangle-exclamation"></i>
            </label>
            <input type="number"
                   name="foul_played"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.foul_played or 0 }}">
        </div>
    </div>

{% else %}

    <!-- Basketball Statistics -->
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Points <i class="fa-solid fa-basketball"></i></label>
            <input type="number"
                   name="points"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.points or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Assists <i class="fa-solid fa-handshake"></i></label>
            <input type="number"
                   name="assists"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.assists or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Blocks <i class="fa-solid fa-shield-alt"></i></label>
            <input type="number"
                   name="blocks"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.blocks or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Sent Off court <i class="fa-solid fa-user-slash"></i></label>
            <input type="number"
                   name="sent_off"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.sent_off or 0 }}">
        </div>
        <div class="col-md-6">
    <label class="form-label">
        Rebounds
        <i class="fa-solid fa-basketball"></i>
    </label>

    <select name="rebound_type" class="form-select">
        <option value="">-- Select --</option>
        <option value="Offensive rebound"
            {% if record.rebound_type == 'Offensive rebound' %}selected{% endif %}>
            Offensive rebound
        </option>
        <option value="Defensive rebound"
            {% if record.rebound_type == 'Defensive rebound' %}selected{% endif %}>
            Defensive rebound
        </option>
    </select>
</div>
    </div>

{% endif %}

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {

    /* =========================================================
       POSITION / GOALKEEPER STATISTICS
       ========================================================= */

    const positionSelect =
        document.getElementById('editPositionSelect');

    const goalkeeperStats =
        document.getElementById('goalkeeperStats');

    function updateGoalkeeperStats() {

        if (!positionSelect || !goalkeeperStats) {
            return;
        }

        goalkeeperStats.style.display =
            positionSelect.value === 'GK' ? 'flex' : 'none';
    }

    if (positionSelect) {
        positionSelect.addEventListener(
            'change',
            updateGoalkeeperStats
        );

        updateGoalkeeperStats();
    }


    /* =========================================================
       COMPETITION / TROPHY RULES
       ========================================================= */

    const competitionSelect =
        document.getElementById('editCompetitionCategory');

    const trophyOptions =
        document.getElementById('trophyOptions');

    const clubDivisionOptions =
        document.getElementById('clubDivisionOptions');

    const clubDivision =
        document.getElementById('clubDivision');


    /*
     * Competition -> trophy options, from competitions.py.
     * Keys are "sport|competition|division"; the division part is
     * only used for Club League.
     */
    const trophyData = JSON.parse(
        document.getElementById('trophyOptionsData').textContent
    );

    const trophyOptionsTable = trophyData.table;
    const recordSport = trophyData.sport;
    const originalCompetition = trophyData.competition;
    const originalTrophy = trophyData.trophy;

    /*
     * Retired trophy names (e.g. "Club Trophy") this record may keep
     * while its competition is unchanged.
     */
    const legacyTrophies = trophyData.legacy;

    let selectedTrophy = originalTrophy;


    /*
     * One radio button per trophy: a game record has exactly one.
     */
    function addTrophyRadio(value, index, label) {

        const wrapper = document.createElement('div');
        wrapper.className = 'col-md-6';

        const check = document.createElement('div');
        check.className = 'form-check';

        const input = document.createElement('input');
        input.className = 'form-check-input';
        input.type = 'radio';
        input.name = 'trophy';
        input.value = value;
        input.id = 'editTrophy' + index;
        input.required = true;
        input.checked = value === selectedTrophy;

        input.addEventListener('change', function () {
            selectedTrophy = this.value;
        });

        const text = document.createElement('label');
        text.className = 'form-check-label';
        text.htmlFor = input.id;
        text.textContent = label || value;

        check.appendChild(input);
        check.appendChild(text);
        wrapper.appendChild(check);
        trophyOptions.appendChild(wrapper);
    }


    function showTrophyMessage(message) {

        const wrapper = document.createElement('div');
        wrapper.className = 'col-12';

        const text = document.createElement('div');
        text.className = 'text-muted';
        text.textContent = message;

        wrapper.appendChild(text);
        trophyOptions.appendChild(wrapper);
    }


    /*
     * Update trophy choices based on:
     *
     * 1. Sport
     * 2. Competition
     * 3. Club League Division (Football)
     */
    function updateTrophies() {

        if (!competitionSelect || !trophyOptions) {
            return;
        }

        const competition = competitionSelect.value;

        trophyOptions.innerHTML = '';

        if (!competition) {
            showTrophyMessage('Please select a competition category first.');
            return;
        }

        const division =
            competition === 'Club League' && clubDivision
                ? clubDivision.value
                : '';

        if (
            competition === 'Club League' &&
            recordSport === 'Football' &&
            !division
        ) {
            showTrophyMessage('Please select the Club League Division first.');
            return;
        }

        const options =
            trophyOptionsTable[
                recordSport + '|' + competition + '|' + division
            ] || [];

        options.forEach(function (value, index) {
            addTrophyRadio(value, index + 1);
        });

        if (
            competition === originalCompetition &&
            legacyTrophies.includes(originalTrophy) &&
            !options.includes(originalTrophy)
        ) {
            addTrophyRadio(
                originalTrophy,
                options.length + 1,
                originalTrophy + ' (previous name)'
            );
        }

        const radios =
            trophyOptions.querySelectorAll('input[name="trophy"]');

        if (radios.length === 1) {
            radios[0].checked = true;
            selectedTrophy = radios[0].value;
        }
    }


    /*
     * Club League Division.
     */
    function updateClubDivision() {

        if (
            !competitionSelect ||
            !clubDivisionOptions ||
            !clubDivision
        ) {
            return;
        }

        if (
            competitionSelect.value ===
            'Club League'
        ) {

            clubDivisionOptions.style.display =
                'block';

            clubDivision.required = true;

        } else {

            clubDivisionOptions.style.display =
                'none';

            clubDivision.required = false;

            clubDivision.value = '';
        }
    }


    /*
     * AFCON / WAFU / World Cup team.
     */
    const competitionTeamOptions =
        document.getElementById('competitionTeamOptions');

    const competitionTeam =
        document.getElementById('competitionTeam');

    const competitionTeamLabel =
        document.getElementById('competitionTeamLabel');

    const competitionTeamData = JSON.parse(
        document.getElementById('competitionTeamData').textContent
    );

    const teamOptionsByCompetition = competitionTeamData.options;
    const teamLabelsByCompetition = competitionTeamData.labels;
    let selectedCompetitionTeam = competitionTeamData.selected;

    function updateCompetitionTeam() {

        if (
            !competitionSelect ||
            !competitionTeamOptions ||
            !competitionTeam
        ) {
            return;
        }

        const options =
            teamOptionsByCompetition[competitionSelect.value];

        competitionTeam.innerHTML = '';

        if (!options) {

            competitionTeamOptions.style.display = 'none';
            competitionTeam.required = false;

            return;
        }

        const label =
            teamLabelsByCompetition[competitionSelect.value];

        competitionTeamLabel.textContent = label;

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = '-- Select ' + label + ' --';
        competitionTeam.appendChild(placeholder);

        options.forEach(function (value) {

            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            option.selected = value === selectedCompetitionTeam;

            competitionTeam.appendChild(option);
        });

        competitionTeamOptions.style.display = 'block';
        competitionTeam.required = true;
    }

    if (clubDivision) {

        clubDivision.addEventListener(
            'change',
            updateTrophies
        );
    }

    if (competitionTeam) {

        competitionTeam.addEventListener(
            'change',
            function () {
                selectedCompetitionTeam = this.value;
            }
        );
    }


    /*
     * Competition changed.
     */
    if (competitionSelect) {

        competitionSelect.addEventListener(
            'change',
            function () {

                updateTrophies();
                updateClubDivision();
                updateCompetitionTeam();

            }
        );

        /*
         * Run when page first loads so the
         * existing record is displayed correctly.
         */
        updateTrophies();
        updateClubDivision();
        updateCompetitionTeam();
    }


    /* =========================================================
       GAME-BY-GAME RULES
       ========================================================= */

    const gamesPlayedInput =
        document.getElementById('gamesPlayedInput');

    const motmInput =
        document.getElementById('motmInput');


    if (gamesPlayedInput) {

        gamesPlayedInput.value = '1';

        gamesPlayedInput.addEventListener(
            'input',
            function () {
                this.value = '1';
            }
        );
    }


    if (motmInput) {

        motmInput.value = '1';

        motmInput.addEventListener(
            'input',
            function () {
                this.value = '1';
            }
        );
    }

});
</script>

{% endblock %}
