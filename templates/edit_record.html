{% extends "base.html" %}
{% block title %}Edit Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-header">
        <h4 class="mb-0">Edit {{ record.sport }} Record ({{ record.year }})</h4>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Position</label>
              <input type="text" name="position" class="form-control" value="{{ record.position }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Games Played</label>
              <input type="number" name="games_played" class="form-control" value="{{ record.games_played }}" min="0">
            </div>
<div class="mb-4">
  <label class="form-label">Team Played For <i class="fa-solid fa-users"></i></label>
  <input type="text" name="team" class="form-control" value="{{ record.team or '' }}" placeholder="e.g. LPRC Oilers / St. John High School">
</div>

    <div class="row">
                  <label class="form-label">Trophy Won <i class="fa-solid fa-trophy"></i></label>
    <div class="col-md-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="University Championship" id="trophy1">
        <label class="form-check-label" for="trophy1">University Championship</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="Classes League" id="trophy2">
        <label class="form-check-label" for="trophy2">Classes League</label>
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="County Meet" id="trophy3">
        <label class="form-check-label" for="trophy3">County Meet</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="Club Trophy" id="trophy4">
        <label class="form-check-label" for="trophy4">Club Trophy</label>
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="Community Trophy" id="trophy5">
        <label class="form-check-label" for="trophy5">Community Trophy</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="None" id="trophy6">
        <label class="form-check-label" for="trophy6">None</label>
      </div>
    </div>
  </div>
          </div>

          {% if record.sport == 'Football' %}
          <div class="row g-3 mt-2">
            <div class="col-md-3">
              <label class="form-label">Goals</label>
              <input type="number" name="goals" class="form-control" value="{{ record.goals or 0 }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Assists</label>
              <input type="number" name="assists" class="form-control" value="{{ record.assists or 0 }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Yellow Cards</label>
              <input type="number" name="yellow_cards" class="form-control" value="{{ record.yellow_cards or 0 }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Red Cards</label>
              <input type="number" name="red_cards" class="form-control" value="{{ record.red_cards or 0 }}">
            </div>
          </div>
          {% else %}
          <div class="row g-3 mt-2">
            <div class="col-md-3">
              <label class="form-label">Points</label>
              <input type="number" name="points" class="form-control" value="{{ record.points or 0 }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Assists</label>
              <input type="number" name="assists" class="form-control" value="{{ record.assists or 0 }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Blocks</label>
              <input type="number" name="blocks" class="form-control" value="{{ record.blocks or 0 }}">
            </div>
            <div class="col-md-3">
              <label class="form-label">Times Sent Off</label>
              <input type="number" name="sent_off" class="form-control" value="{{ record.sent_off or 0 }}">
            </div>
          </div>
          {% endif %}

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
