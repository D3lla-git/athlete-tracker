{% extends "base.html" %}
{% block title %}Edit Record{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow">
      <div class="card-header">
        <h4 class="mb-0">Edit {{ record.sport }} Record ({{ record.year }})</h4>
      </div>
      <div class="card-body">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Position</label>
              <input type="text" name="position" class="form-control" value="{{ record.position }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Games Played</label>
              <input type="number" name="games_played" class="form-control" value="{{ record.games_played }}" min="0">
            </div>
<div class="row g-3 mt-1">
  <div class="col-md-6">
   <label class="form-label">
    {% if record.sport == 'Kickball' %}
        QOTM
    {% else %}
        Man of the Match
    {% endif %}
    <i class="fa-solid fa-medal"></i>
</label>
    <input type="number"
           name="man_of_the_match"
           class="form-control"
           value="{{ record.man_of_the_match or 0 }}"
           min="0"
           step="1">
  </div>

  <div class="col-md-6">
    <label class="form-label">
      MVP <i class="fa-solid fa-star"></i>
    </label>
    <input type="number"
           name="mvp"
           class="form-control"
           value="{{ record.mvp or 0 }}"
           min="0"
           step="1">
  </div>
</div>

<div class="mb-4">
  <label class="form-label">Team Played For <i class="fa-solid fa-users"></i></label>
  <input type="text" name="team" class="form-control" value="{{ record.team or '' }}" placeholder="e.g. LPRC Oilers / St. John High School" required>
</div>

<div class="mb-4">
  <label class="form-label">Opponet <i class="fa-solid fa-shield-halved"></i></label>
  <input type="text" name="team_played_against" class="form-control" value="{{ record.team_played_against or '' }}" placeholder="e.g. St. Mary Catholic School" required>
</div>

<div class="mb-4">
  <label class="form-label">
    Competition <i class="fa-solid fa-trophy"></i>
  </label>

  <select name="competition_category" class="form-select" required>
    <option value="">-- Select Competition --</option>

    {% if 'All Athlete' in registered_categories or 'County Meet Athlete' in registered_categories %}
      <option value="County Meet"
        {% if record.competition_category == 'County Meet' %}selected{% endif %}>
        County Meet
      </option>
    {% endif %}

    {% if 'All Athlete' in registered_categories or 'Club League Athlete' in registered_categories %}
      <option value="Club League"
        {% if record.competition_category == 'Club League' %}selected{% endif %}>
        Club League
      </option>
    {% endif %}

    {% if 'All Athlete' in registered_categories or 'University Athlete' in registered_categories %}
      <option value="University League"
        {% if record.competition_category == 'University League' %}selected{% endif %}>
        University League
      </option>
    {% endif %}

    {% if 'All Athlete' in registered_categories or 'Community/Area League Athlete' in registered_categories %}
      <option value="Community/Area League"
        {% if record.competition_category == 'Community/Area League' %}selected{% endif %}>
        Community/Area League
      </option>
    {% endif %}

    {% if 'All Athlete' in registered_categories or 'High School Athlete' in registered_categories %}
      <option value="High School"
        {% if record.competition_category == 'High School' %}selected{% endif %}>
        High School
      </option>
    {% endif %}
  </select>
</div>

    <div class="row">
                  <label class="form-label">Trophy Won <i class="fa-solid fa-trophy"></i></label>
    <div class="col-md-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="University Championship" id="trophy1">
        <label class="form-check-label" for="trophy1">University Championship</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="Classes League" id="trophy2">
        <label class="form-check-label" for="trophy2">Classes League</label>
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="County Meet" id="trophy3">
        <label class="form-check-label" for="trophy3">County Meet</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="Club Trophy" id="trophy4">
        <label class="form-check-label" for="trophy4">Club Trophy</label>
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="Community Trophy" id="trophy5">
        <label class="form-check-label" for="trophy5">Community Trophy</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="trophy" value="None" id="trophy6">
        <label class="form-check-label" for="trophy6">None</label>
      </div>
    </div>
  </div>
          </div>

  {% if record.sport == 'Football' %}

    <!-- Football Statistics -->
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Goals <i class="fa-solid fa-futbol"></i></label>
            <input type="number"
                   name="goals"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.goals or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Assists <i class="fa-solid fa-handshake"></i></label>
            <input type="number"
                   name="assists"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.assists or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Yellow Cards <i class="fa-solid fa-square" style="color: yellow;"></i></label>
            <input type="number"
                   name="yellow_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.yellow_cards or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Red Cards <i class="fa-solid fa-square" style="color: red;"></i></label>
            <input type="number"
                   name="red_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.red_cards or 0 }}">
        </div>
    </div>

{% elif record.sport == 'Kickball' %}

    <!-- Kickball Statistics -->
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">
                Home Run <i class="fa-solid fa-baseball"></i>
            </label>
            <input type="number"
                   name="home_runs"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.home_runs or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Red Card <i class="fa-solid fa-square" style="color: red;"></i>
            </label>
            <input type="number"
                   name="kickball_red_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.kickball_red_cards or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Yellow Card <i class="fa-solid fa-square" style="color: yellow;"></i>
            </label>
            <input type="number"
                   name="kickball_yellow_cards"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.kickball_yellow_cards or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Cut Base <i class="fa-solid fa-person-running"></i>
            </label>
            <input type="number"
                   name="cut_base"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.cut_base or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">
                Foul Played <i class="fa-solid fa-triangle-exclamation"></i>
            </label>
            <input type="number"
                   name="foul_played"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.foul_played or 0 }}">
        </div>
    </div>

{% else %}

    <!-- Basketball Statistics -->
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Points <i class="fa-solid fa-basketball"></i></label>
            <input type="number"
                   name="points"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.points or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Assists <i class="fa-solid fa-handshake"></i></label>
            <input type="number"
                   name="assists"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.assists or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Blocks <i class="fa-solid fa-shield-alt"></i></label>
            <input type="number"
                   name="blocks"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.blocks or 0 }}">
        </div>

        <div class="col-md-6">
            <label class="form-label">Sent Off court <i class="fa-solid fa-user-slash"></i></label>
            <input type="number"
                   name="sent_off"
                   class="form-control"
                   min="0"
                   step="1"
                   value="{{ record.sent_off or 0 }}">
        </div>
    </div>

{% endif %}

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
