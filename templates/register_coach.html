{% extends "base.html" %}
{% block title %}Register as Coach{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <div class="card-header text-center">
        <h4 class="mb-0">Register as Coach / Admin <i class="fa-solid fa-user-tie"></i></h4>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Coach Name  <i class="fa-solid fa-user-tie"></i></i></label>
            <input type="text" name="full_name" placeholder="Example: 'Coach John'" class="form-control" required>
          </div>

          <div class="mb-3">
             <label class="form-label">High School/Club/University/Community Team</label>
            <input type="text" name="school" placeholder="Example: St. John's High School" class="form-control" required>
          </div>

         <div class="mb-3">
  <label class="form-label">Password</label>
  <div class="input-group">
    <input type="password" name="password" id="password" placeholder="Example: @Xxxxx" class="form-control" required>
    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
      <i class="fa-solid fa-eye" id="eyeIcon"></i>
    </button>
  </div>
</div>

<script>
  const togglePassword = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  togglePassword.addEventListener('click', function () {
    // Toggle the type attribute
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);

    // Toggle the eye icon
    if (type === 'password') {
      eyeIcon.classList.remove('fa-eye-slash');
      eyeIcon.classList.add('fa-eye');
    } else {
      eyeIcon.classList.remove('fa-eye');
      eyeIcon.classList.add('fa-eye-slash');
    }
  });
</script>

          <div class="mb-3">
            <label class="form-label">Coach Secret Code</label>
            <input type="text" name="secret_code" class="form-control" placeholder="Enter secret code" required>
          </div>
<div class="mb-3">
            <label>ID or Passport (PNG/JPG/PDF)</label>
            <input type="file" name="id_document" class="form-control" accept=".png,.jpg,.jpeg,.pdf" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Coach Account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
