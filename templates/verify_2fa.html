{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width: 500px;">

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="text-center mb-4">
                <i class="fa-solid fa-shield-halved fa-3x"></i>

                <h3 class="mt-3">
                    Two-Factor Authentication
                </h3>

                <p class="text-muted">
                    Verify your identity to continue.
                </p>
            </div>

            <!-- Authenticator App -->
            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="mb-3">
                    <label for="code" class="form-label">
                        Authenticator Code
                    </label>

                    <input
                        type="text"
                        id="code"
                        name="code"
                        class="form-control text-center"
                        placeholder="000000"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">
                    <i class="fa-solid fa-shield-halved"></i>
                    Verify Authenticator Code
                </button>

            </form>

            <div class="text-center my-3">
                <span class="text-muted">OR</span>
            </div>

            <!-- Recovery Code -->
            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="mb-3">
                    <label for="recovery_code" class="form-label">
                        Recovery Code
                    </label>

                    <input
                        type="text"
                        id="recovery_code"
                        name="recovery_code"
                        class="form-control text-center"
                        placeholder="XXXXX-XXXXX"
                        maxlength="11"
                        autocomplete="off"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-outline-secondary w-100">
                    <i class="fa-solid fa-key"></i>
                    Use Recovery Code
                </button>

            </form>

            <div class="text-center mt-3">
                <a
                    href="{{ url_for('login') }}"
                    class="text-decoration-none">
                    Back to Login
                </a>
            </div>

        </div>
    </div>

</div>

{% endblock %}
